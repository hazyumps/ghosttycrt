# Example session tree for ghosttycrt. See spec/03-data-model.md.
#
# Credentials are always a provider plus a reference — never a value.

[[session]]
id          = "b3f1c2a4-5d6e-4f70-8a91-2c3d4e5f6a70"
name        = "core-sw-01"
slug        = "core-sw-01"
transport   = "ssh"
group       = "network/switches"
tags        = ["cisco", "prod"]
pinned      = true
description = "Cisco C9300, rack A"

  [session.ssh]
  host = "10.1.3.11"
  port = 22
  user = "admin"

  [session.logging]
  enabled = true

  [session.credentials]
  provider = "infisical"
  ref      = "CORE-SW-01-PASS"

[[session]]
id        = "c9e7d8b6-1a2b-4c3d-9e8f-0a1b2c3d4e5f"
name      = "dist-sw-04"
slug      = "dist-sw-04"
transport = "ssh"
group     = "network/switches"
tags      = ["cisco"]

  [session.ssh]
  host = "10.1.3.14"
  user = "admin"

[[session]]
id        = "d1a2b3c4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
name      = "console-core-sw-01"
slug      = "console-core-sw-01"
transport = "serial"
group     = "network/console"
tags      = ["cisco", "console"]

  [session.serial]
  device   = "/dev/tty.usbserial-1420"
  baud     = 9600
  databits = 8
  parity   = "none"
  stopbits = 1
  flow     = "none"

  [session.logging]
  enabled = true

  [session.on_connect]
  steps = [
    { expect = "login:",    send = "admin" },
    { expect = "Password:", send = "{secret}", redact = true },
    { expect = ">",         send = "terminal length 0" },
  ]

[[session]]
id        = "e5f6a7b8-c9d0-4e1f-8a2b-3c4d5e6f7a8b"
name      = "esxi-02"
slug      = "esxi-02"
transport = "ssh"
group     = "servers"
tags      = ["vmware"]

  [session.ssh]
  host     = "10.1.3.20"
  user     = "root"
  identity = "~/.ssh/id_ed25519"

[[session]]
id        = "f7a8b9c0-d1e2-4f3a-8b4c-5d6e7f8a9b0c"
name      = "k3s-01"
slug      = "k3s-01"
transport = "ssh"
group     = "servers"
tags      = ["k8s", "prod"]

  [session.ssh]
  host = "10.1.3.30"
  user = "patrick"
  jump = "bastion"
