# Example config for ghosttycrt. Every key is optional; the built-in defaults
# are these values. See spec/03-data-model.md.

[general]
default_transport = "ssh"
# inline    — enter suspends the tree and hands the terminal to tmux attach
# workspace — the tree lives in its own tmux pane with sessions beside it
display_mode      = "inline"
workspace_tree_width = 34
# tabs    — every connection gets its own tab, the tree in a tab of its own
# sidebar — tree pinned on the left, connections as tabs in the region beside it
# split   — connections tile as panes beside the tree, several visible at once
workspace_layout  = "tabs"
confirm_on_quit   = true
secret_scrub_logs = true

[general.theme]
name = "auto"

[transports.ssh]
binary     = "ssh"
extra_args = ["-o", "ServerAliveInterval=30"]

[transports.serial]
backend      = "picocom"
default_baud = 9600

[transports.telnet]
binary = "telnet"

[logging]
enabled_by_default = false
directory          = ""
timestamp          = true
rotate_mb          = 50

[credentials]
default_provider = "infisical"

[credentials.providers.infisical]
command = ["infisical", "secrets", "get", "{ref}", "--plain", "--env=prod"]

[credentials.providers.vaultwarden]
command        = ["rbw", "get", "{ref}"]
unlock_command = ["rbw", "unlock"]

[import.ssh_config]
enabled = true
path    = "~/.ssh/config"

[display.ghostty]
cli_path = "/Applications/Ghostty.app/Contents/MacOS/ghostty"
